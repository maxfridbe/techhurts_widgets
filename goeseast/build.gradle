plugins {
    id 'com.android.library'
}

android {
    namespace 'com.techhurts.goeseast'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding false
        dataBinding false
        resValues false
        buildConfig false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
