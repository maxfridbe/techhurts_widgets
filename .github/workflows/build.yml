name: build

# Manual only: nothing builds or publishes until someone clicks "Run workflow".
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed APKs as a GitHub release
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Signing key, set under Settings → Secrets and variables → Actions.
      # Without it the APKs get a throwaway debug key and no release is published.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build builder image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: android-widget-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Decode signing key
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set; building debug APKs with a throwaway key"
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
          fi

      # Version YY.MMDD.###: ### is one past the higher of the committed
      # version.properties counter and today's newest release, so every CI
      # build outranks both local builds that were committed and earlier releases.
      - name: Pick version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today=$(date +%y%m%d); prefix="${today:0:2}.${today:2:4}."
          committed=0
          if grep -q "^versionDate=$today$" version.properties; then
            committed=$((10#$(sed -n 's/^versionBuild=//p' version.properties)))
          fi
          released=$(gh release list --limit 100 --json tagName -q '.[].tagName' \
            | sed -n "s/^${prefix//./\\.}\([0-9]\{3\}\)$/\1/p" | sort -n | tail -1)
          released=$((10#${released:-0}))
          build=$(( (committed > released ? committed : released) + 1 ))
          echo "committed=$committed released=$released -> build $build"
          echo "VERSION_BUILD=$build" >> "$GITHUB_ENV"

      - name: Build APKs
        run: CONTAINER_ENGINE=docker SKIP_IMAGE_BUILD=1 ./make.sh

      - name: Verify APK signatures
        run: |
          docker run --rm --entrypoint sh -v "$PWD/output:/out" android-widget-builder -c '
            set -e
            for f in /out/*.apk; do
              echo "== $f"
              /opt/android-sdk/build-tools/34.0.0/apksigner verify --print-certs "$f" | head -3
            done'

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: output/*.apk
          if-no-files-found: error

      # Signed builds only, and only when the run was started with "publish" ticked.
      # Each release is tagged with its version and marked as the latest release.
      - name: Publish release
        if: inputs.publish && env.KEYSTORE_B64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(basename output/com.techhurts.Calculator.*.apk .apk | sed 's/^com\.techhurts\.Calculator\.//')
          gh release create "$version" --target "$GITHUB_SHA" --latest \
            --title "$version" --notes "Signed APKs built from ${GITHUB_SHA}." output/*.apk
