plugins { id 'com.android.application' }

android {
    namespace 'com.techhurts.himawari8'
    compileSdk 34
    defaultConfig {
        applicationId "com.techhurts.himawari8"
        minSdk 21; targetSdk 34
        versionCode((project.findProperty('appVersionCode') ?: '1').toInteger()); versionName project.findProperty('appVersionName') ?: '0.0000.000-dev'
    }
    buildTypes {
        release { minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildFeatures { viewBinding false; dataBinding false; resValues false; buildConfig false }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
