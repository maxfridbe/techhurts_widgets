plugins { id 'com.android.library' }

android {
    namespace 'com.techhurts.himawari8'
    compileSdk 34
    defaultConfig {
        minSdk 21; targetSdk 34
        // Do not rasterise the vector icons to PNGs. AGP does that for API
        // 21-23 because a VectorDrawable gained gradients in 24, and its
        // rasteriser cannot follow an @color reference — which is the point of
        // the icon colours living in values/. The graded plate sits in
        // drawable-anydpi-v24 and a flat one in drawable/, so those APIs are
        // served either way.
        vectorDrawables.generatedDensities = []
    }
    buildTypes {
        release { minifyEnabled false
                  proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildFeatures { viewBinding false; dataBinding false; resValues false; buildConfig false }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
