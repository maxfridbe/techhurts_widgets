// build.gradle (Project level)
plugins {
    id 'com.android.application' version '8.2.0' apply false
}

// Signing: every app signs debug and release builds with the one key make.sh
// passes in (appKeystoreFile / appKeystorePassword / appKeyAlias / appKeyPassword).
// Without those properties AGP falls back to its default debug key.
subprojects {
    pluginManager.withPlugin('com.android.application') {
        def keystore = findProperty('appKeystoreFile')
        if (!keystore) return
        android {
            signingConfigs {
                shared {
                    storeFile file(keystore)
                    storePassword findProperty('appKeystorePassword')
                    keyAlias findProperty('appKeyAlias')
                    keyPassword findProperty('appKeyPassword')
                }
            }
            buildTypes {
                debug { signingConfig signingConfigs.shared }
                release { signingConfig signingConfigs.shared }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
