plugins {
    id 'com.android.application'
}

// Thin wrapper: everything lives in the :hisense_remote library, which the widget
// pack also includes. This module only gives it an identity and signs it.
android {
    namespace 'com.techhurts.hisense_remote.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.techhurts.hisense_remote"
        minSdk 21
        targetSdk 34
        versionCode((project.findProperty('appVersionCode') ?: '1').toInteger())
        versionName project.findProperty('appVersionName') ?: '0.0000.000-dev'
    }

    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':hisense_remote')
}
