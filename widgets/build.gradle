plugins {
    id 'com.android.application'
}

// The whole collection in one APK: every widget library merged together, so a
// single install offers all of them in the launcher's widget picker.
android {
    namespace 'com.techhurts.widgets'
    compileSdk 34

    defaultConfig {
        applicationId "com.techhurts.widgets"
        minSdk 24            // the highest minSdk among the libraries (timer)
        targetSdk 34
        // Do not rasterise the vector icons to PNGs. AGP does that for API
        // 21-23 because a VectorDrawable gained gradients in 24, and its
        // rasteriser cannot follow an @color reference — which is the point of
        // the icon colours living in values/. The graded plate sits in
        // drawable-anydpi-v24 and a flat one in drawable/, so those APIs are
        // served either way.
        vectorDrawables.generatedDensities = []
        versionCode((project.findProperty('appVersionCode') ?: '1').toInteger())
        versionName project.findProperty('appVersionName') ?: '0.0000.000-dev'
    }

    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':app')
    implementation project(':calculator')
    implementation project(':goeseast')
    implementation project(':himawari8')
    implementation project(':hisense_remote')
    implementation project(':timer')
}
